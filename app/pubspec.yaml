name: d2lootalert
description: "Alerts for Destiny 2 bonus focus weapons and featured raids."
publish_to: 'none' # private app, never published to pub.dev

# versionName+versionCode on Android, CFBundleShortVersionString+CFBundleVersion on iOS.
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^5.0.0       # starts Firebase (needed by the two below)
  cloud_firestore: ^7.0.0     # reads rotation/current and the loot pools
  firebase_messaging: ^17.0.0 # push notifications and topic subscriptions
  shared_preferences: ^2.5.6  # remembers the watch list on the phone
  flutter_local_notifications: ^22.3.2 # draws Android alerts: weapon icon, banner when expanded (#30)

# Pinned (#21): shared_preferences_android 2.5.0 (2026-10-17) crashes release
# builds at startup. Its new JNI bridge calls a method that code shrinking (R8)
# strips, so SharedPreferences.getInstance() throws NoSuchMethodError. 2.4.28 is
# the last version before that change. Remove this once a fixed version is out
# and a release build starts cleanly.
dependency_overrides:
  shared_preferences_android: 2.4.28

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4 # generates the app icons below (#42); never ships in the app

# App icon by Owen Hartman (#42). To change it, replace assets/icon/app_icon.png and
# run `dart run flutter_launcher_icons` in app/. That rewrites the iOS asset catalog
# and Android's mipmap-* folders. The Android notification icon is separate
# (android/app/src/main/res/drawable-*/ic_notification.png, see CLAUDE.md).
flutter_launcher_icons:
  image_path: assets/icon/app_icon.png
  ios: true
  remove_alpha_ios: true # App Store Connect rejects icons with an alpha channel
  android: true # replaces ic_launcher, the name AndroidManifest.xml already uses
  # Android 8+ adaptive icon: launchers crop it to their own shape (often a circle).
  adaptive_icon_background: "#323282" # the artwork's own background colour
  adaptive_icon_foreground: assets/icon/app_icon.png
  # 17% padding per side leaves the artwork at 66% of the canvas, so its corners stay
  # inside the circle every launcher keeps visible (the default 16% clips them slightly).
  adaptive_icon_foreground_inset: 17

flutter:
  uses-material-design: true # Material icons (info, refresh...)

  assets:
    - assets/fonts/Inter-OFL.txt # shown on the licenses page; the OFL requires shipping it

  # Inter (SIL Open Font License 1.1), https://rsms.me/inter
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
